name: Build and release

on:
  push:
    tags: v*
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:

  test:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg
            ~/go/src
            ~/.cache/go-build
            ~/.cache/golangci-lint
            .gobincache
          key: v3-test-${{ runner.os }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            v3-test-${{ runner.os }}-

      - run: scripts/test

      - name: Report code coverage
        env:
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
        if: env.COVERALLS_TOKEN
        run: |
          scripts/cover
          .gobincache/goveralls -coverprofile=cover.out -service=GitHub

  # Only version tags are published: SLSA provenance requires a versioned,
  # reproducible release, and GoReleaser's --snapshot mode (what would be
  # needed to publish from a bare main-branch commit) explicitly disables
  # all publishing. main pushes only run the `test` job above.
  goreleaser:
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    outputs:
      hashes: ${{ steps.binary.outputs.hashes }}
      alpine-image: ${{ steps.alpine-image.outputs.name }}
      alpine-digest: ${{ steps.alpine-image.outputs.digest }}
      chainguard-image: ${{ steps.chainguard-image.outputs.name }}
      chainguard-digest: ${{ steps.chainguard-image.outputs.digest }}
      chainguard-fips-image: ${{ steps.chainguard-fips-image.outputs.name }}
      chainguard-fips-digest: ${{ steps.chainguard-fips-image.outputs.digest }}
    permissions:
      contents: write # to create the GitHub release and upload assets
      id-token: write # to sign with cosign (keyless/OIDC)
      packages: write # to push to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: anchore/sbom-action/download-syft@v0.15.0
      - uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: '1'

      - name: Generate binary hashes
        id: binary
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
          echo "hashes=$(cat "$checksum_file" | base64 -w0)" >> "$GITHUB_OUTPUT"

      # dockers_v2 pushes each (image, tag) as a single multi-platform manifest
      # already -- one "Docker Image" artifact per tag, digest in .extra.Digest.
      # Filter to ghcr.io (our provenance-attested registry) and the versioned
      # tag (excluding the floating "latest"/"latest-chainguard" tags) so
      # provenance is pinned to an immutable reference.
      - name: Alpine image digest
        id: alpine-image
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          image_and_digest=$(echo "$ARTIFACTS" | jq -r '
            .[] | select(.type=="Docker Image" and .extra.ID=="dockerize-alpine")
                | select(.name | startswith("ghcr.io"))
                | select(.name | contains(":latest") | not)
                | "\(.name)@\(.extra.Digest)"' | head -n1)
          echo "name=$(echo "$image_and_digest" | cut -d'@' -f1 | cut -d':' -f1)" >> "$GITHUB_OUTPUT"
          echo "digest=$(echo "$image_and_digest" | cut -d'@' -f2)" >> "$GITHUB_OUTPUT"

      - name: Chainguard image digest
        id: chainguard-image
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          image_and_digest=$(echo "$ARTIFACTS" | jq -r '
            .[] | select(.type=="Docker Image" and .extra.ID=="dockerize-chainguard")
                | select(.name | startswith("ghcr.io"))
                | select(.name | contains(":latest") | not)
                | "\(.name)@\(.extra.Digest)"' | head -n1)
          echo "name=$(echo "$image_and_digest" | cut -d'@' -f1 | cut -d':' -f1)" >> "$GITHUB_OUTPUT"
          echo "digest=$(echo "$image_and_digest" | cut -d'@' -f2)" >> "$GITHUB_OUTPUT"

      - name: Chainguard FIPS image digest
        id: chainguard-fips-image
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          image_and_digest=$(echo "$ARTIFACTS" | jq -r '
            .[] | select(.type=="Docker Image" and .extra.ID=="dockerize-chainguard-fips")
                | select(.name | startswith("ghcr.io"))
                | select(.name | contains(":latest") | not)
                | "\(.name)@\(.extra.Digest)"' | head -n1)
          echo "name=$(echo "$image_and_digest" | cut -d'@' -f1 | cut -d':' -f1)" >> "$GITHUB_OUTPUT"
          echo "digest=$(echo "$image_and_digest" | cut -d'@' -f2)" >> "$GITHUB_OUTPUT"

  binary-provenance:
    needs: goreleaser
    permissions:
      actions: read # to read the workflow path
      id-token: write # to sign the provenance
      contents: write # to add assets to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true

  alpine-image-provenance:
    needs: goreleaser
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.goreleaser.outputs.alpine-image }}
      digest: ${{ needs.goreleaser.outputs.alpine-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  chainguard-image-provenance:
    needs: goreleaser
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.goreleaser.outputs.chainguard-image }}
      digest: ${{ needs.goreleaser.outputs.chainguard-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  chainguard-fips-image-provenance:
    needs: goreleaser
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.goreleaser.outputs.chainguard-fips-image }}
      digest: ${{ needs.goreleaser.outputs.chainguard-fips-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
